openapi: 3.0.0
info:
    title: Governify Next Reporter API
    version: 1.0.0
    description: |
        Reporter synchronizes the current State projection from Registry into InfluxDB and
        creates Grafana dashboards for a selected agreement version.

        Protected operations require a JWT whose `type` claim is `service`.
servers:
    - url: /
tags:
    - name: Health
    - name: InfluxDB
    - name: Dashboards
paths:
    /health:
        get:
            tags: [Health]
            summary: Check Reporter health
            operationId: getHealth
            responses:
                '200':
                    description: Reporter is running
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [status, message]
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    message:
                                        type: string
                                        example: Health check passed

    /api/v1/influx/organizations/{orgName}/scopes/{scopeId}/agreementCollections/{agColId}/agreementVersions/{agreementVersion}/states/sync:
        post:
            tags: [InfluxDB]
            summary: Synchronize the current States of an agreement version
            operationId: syncAgreementVersionStates
            security:
                - ServiceBearerAuth: []
            description: |
                Retrieves the currently stored States from Registry and writes their latest
                projection to the `states` and `state_metrics` InfluxDB measurements.

                Optional JSON fields `updatedFrom` (inclusive) and `updatedTo` (exclusive)
                are forwarded in a JSON body to Registry's State search to filter by `updatedAt`, not their evaluation
                `date`. Either bound may be omitted independently. Omitting both fields or the
                body synchronizes all States. When both are supplied, `updatedTo` must be after
                or equal to `updatedFrom`; equal bounds synchronize no States.

                `agreementVersion` accepts a one-based number (`1` selects the first version) or
                `auditableVersion`, which Registry resolves to the current auditable version.

                The synchronization includes `IN_PROGRESS`, `COMPLETED`, `FAILED`, compliant,
                non-compliant and indeterminate States. Registry's null `complianceStatus` for an
                `IN_PROGRESS` State is projected as `PENDING` because InfluxDB fields cannot store
                null. Nullable numeric values are accompanied by an `...Available` boolean.

                Repeating the synchronization writes the same logical point identity
                (measurement, tags and State date), updating the current projection. Writes are
                split into bounded batches according to Reporter configuration.
            parameters:
                - $ref: '#/components/parameters/orgName'
                - $ref: '#/components/parameters/scopeId'
                - $ref: '#/components/parameters/agColId'
                - $ref: '#/components/parameters/agreementVersion'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                updatedFrom:
                                    type: string
                                    format: date-time
                                    description: Inclusive lower bound for updatedAt.
                                updatedTo:
                                    type: string
                                    format: date-time
                                    description: Exclusive upper bound for updatedAt.
                        example:
                            updatedFrom: '2026-09-22T10:00:00.000Z'
                            updatedTo: '2026-09-22T11:00:00.000Z'
            responses:
                '200':
                    description: Current States synchronized successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/StateSyncResult'
                            example:
                                success: true
                                message: States synchronized successfully
                                httpStatus: 200
                                appCode: SUCCESS
                                data:
                                    organizationName: universidad-sevilla
                                    scopeId: 69cbdee759092b362376ca17
                                    agColId: 69cbe9901d5009a04361925d
                                    agreementVersion: '2'
                                    statePoints: 12
                                    metricPoints: 36
                                    totalPoints: 48
                                    batches: 1
                                error: null
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '502':
                    $ref: '#/components/responses/BadGateway'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/influx/organizations/{orgName}/scopes/{scopeId}/agreementCollections/{agColId}/agreementVersions/{agreementVersion}/tasks/states/sync:
        parameters:
            - $ref: '#/components/parameters/orgName'
            - $ref: '#/components/parameters/scopeId'
            - $ref: '#/components/parameters/agColId'
            - $ref: '#/components/parameters/agreementVersion'
        post:
            tags: [InfluxDB]
            summary: Create a recurring State synchronization task in Director
            operationId: createStateSyncTask
            security:
                - ServiceBearerAuth: []
                - UserBearerAuth: []
            description: |
                Creates one recurring `syncAgreementVersionStates` task for all signatures of
                the selected version. Resolves organization and scope metadata with Scope Manager
                and validates the collection and version with Registry. `auditableVersion` is
                resolved to a one-based numeric position, which may differ from `versionNumber`.
                Each run synchronizes `updatedAt` in `[scheduledAt - lookbackMs, scheduledAt)`.
                `startDate` defaults to the version validity start. `anchorDate` defaults to
                the selected version's `contract.validity.initial` and can be overridden.
                `endDate` defaults to the selected version's `contract.validity.end`;
                an explicit value overrides it. The resolved end date must be in the future and
                after `startDate`.
                Identical input and scheduling values reuse the existing Director task;
                a repeated request can update its enabled state. Different schedules or
                lookback values create different tasks. Past occurrences are not replayed.
            parameters:
                - name: enabled
                  in: query
                  required: false
                  schema:
                      type: boolean
                      default: true
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StateSyncTaskOptions'
                        examples:
                            requiredFields:
                                summary: Required fields only
                                value:
                                    interval: 300000
                                    lookbackMs: 3600000
                            allFields:
                                summary: All scheduling options
                                value:
                                    interval: 300000
                                    lookbackMs: 3600000
                                    startDate: '2099-01-01T00:00:00.000Z'
                                    anchorDate: '2026-08-01T00:00:00.000Z'
                                    endDate: '2099-02-01T00:00:00.000Z'
            responses:
                '201':
                    description: Task created; data contains the Director task.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StateSyncTaskResponse'
                '200':
                    description: Identical task already exists; data contains the Director task.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StateSyncTaskResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '502':
                    $ref: '#/components/responses/BadGateway'
        get:
            tags: [InfluxDB]
            summary: List recurring State synchronization tasks for an agreement version
            operationId: getStateSyncTasks
            security:
                - ServiceBearerAuth: []
            description: |
                Returns enabled and disabled recurring synchronization tasks matching the resolved
                organization, scope, collection, and version. Other scripts are excluded.
                `auditableVersion` resolves the current version on each request; use a numeric
                selector to manage earlier versions after the auditable version changes.
            responses:
                '200':
                    description: Matching tasks, or an empty array.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/StateSyncTask'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '502':
                    $ref: '#/components/responses/BadGateway'
        delete:
            tags: [InfluxDB]
            summary: Delete recurring State synchronization tasks for an agreement version
            operationId: deleteStateSyncTasks
            security:
                - ServiceBearerAuth: []
            description: |
                Deletes the tasks selected by GET and their execution records through Director.
                Matching uses the script, recurring type, and resolved agreement identifiers.
                This does not delete States in Registry or points in InfluxDB.
            responses:
                '200':
                    description: Counts of deleted tasks and execution records, including zero when none matched.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  deletedTasksCount:
                                                      type: integer
                                                      minimum: 0
                                                  deletedExecutionsCount:
                                                      type: integer
                                                      minimum: 0
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '502':
                    $ref: '#/components/responses/BadGateway'

    /api/v1/dashboards/organizations/{orgName}/scopes/{scopeId}/agreementCollections/{agColId}/agreementVersions/{agreementVersion}:
        post:
            tags: [Dashboards]
            summary: Create or update the Grafana dashboard for an agreement version
            operationId: createAgreementVersionDashboard
            security:
                - ServiceBearerAuth: []
            description: |
                Resolves the selected agreement version through Registry, builds dashboard queries
                against the current Reporter InfluxDB schema, and creates or updates the Grafana
                dashboard. Its default time range starts at the agreement version validity
                `initial` date and ends at `earlyTermination` when present, or at `end` otherwise.
                Compliance percentages exclude `INDETERMINATE` and `PENDING` States.
                The dashboard starts with an agreement overview containing its title, description,
                organization, version, template, and validity in the agreement time zone.
                Early termination includes the originally scheduled end.
            parameters:
                - $ref: '#/components/parameters/orgName'
                - $ref: '#/components/parameters/scopeId'
                - $ref: '#/components/parameters/agColId'
                - $ref: '#/components/parameters/agreementVersion'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                signatureLabelMode:
                                    type: string
                                    enum: [label, signatureId]
                                    default: label
                                    description: |
                                        Use visualizationConfig.label in timelines and signature
                                        comparisons, or signatureId for the previous presentation
                                        using its last six characters. Older signatures without a
                                        configured label retain the previous presentation.
                        examples:
                            configuredLabels:
                                value: { signatureLabelMode: label }
                            signatureIdentifiers:
                                value: { signatureLabelMode: signatureId }
            responses:
                '200':
                    description: Grafana dashboard created or updated
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/DashboardResult'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '502':
                    $ref: '#/components/responses/BadGateway'
                '500':
                    $ref: '#/components/responses/InternalError'

components:
    securitySchemes:
        ServiceBearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: JWT whose `type` claim is `service`.
        UserBearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: JWT whose `type` claim is `user`. Only supported for creating or toggling State synchronization tasks.

    parameters:
        orgName:
            in: path
            name: orgName
            required: true
            description: Organization name
            schema:
                type: string
            example: universidad-sevilla
        scopeId:
            in: path
            name: scopeId
            required: true
            description: Scope identifier used by Registry
            schema:
                type: string
            example: 69cbdee759092b362376ca17
        agColId:
            in: path
            name: agColId
            required: true
            description: Agreement collection ObjectId
            schema:
                type: string
                pattern: '^[a-fA-F0-9]{24}$'
            example: 69cbe9901d5009a04361925d
        agreementVersion:
            in: path
            name: agreementVersion
            required: true
            description: One-based agreement version selector or `auditableVersion`
            schema:
                type: string
                pattern: '^(auditableVersion|[1-9][0-9]*)$'
            examples:
                numeric:
                    value: '2'
                auditable:
                    value: auditableVersion

    schemas:
        StateSyncTaskOptions:
            type: object
            required: [interval, lookbackMs]
            properties:
                interval:
                    type: integer
                    minimum: 1
                    maximum: 9007199254740991
                    description: Time between scheduled executions in milliseconds.
                lookbackMs:
                    type: integer
                    minimum: 1
                    maximum: 9007199254740991
                    description: Milliseconds before scheduledAt to include in each synchronization.
                startDate:
                    type: string
                    format: date-time
                    description: Earliest execution date; defaults to agreement version validity start.
                anchorDate:
                    type: string
                    format: date-time
                    description: Recurrence reference date; defaults to the selected agreement version's contract.validity.initial.
                endDate:
                    type: string
                    format: date-time
                    description: Final execution date, in the future and after startDate. Defaults to the selected agreement version's contract.validity.end.
        StateSyncTask:
            allOf:
                - type: object
                  properties:
                      interval:
                          type: integer
                          minimum: 1
                      startDate:
                          type: string
                          format: date-time
                      anchorDate:
                          type: string
                          format: date-time
                      endDate:
                          type: string
                          format: date-time
                      _id:
                          type: string
                      script:
                          type: string
                          enum: [syncAgreementVersionStates]
                      type:
                          type: string
                          enum: [RECURRING]
                      enabled:
                          type: boolean
                      inputArgs:
                          type: object
                          properties:
                              orgName:
                                  type: string
                              orgId:
                                  type: string
                              scopeId:
                                  type: string
                              agColId:
                                  type: string
                              agreementVersion:
                                  type: integer
                                  minimum: 1
                              lookbackMs:
                                  type: integer
                                  minimum: 1
        StateSyncTaskResponse:
            allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                      data:
                          $ref: '#/components/schemas/StateSyncTask'
        SuccessResponse:
            type: object
            required: [success, message, httpStatus, appCode, data, error]
            properties:
                success:
                    type: boolean
                    example: true
                message:
                    type: string
                httpStatus:
                    type: integer
                    example: 200
                appCode:
                    type: string
                    example: SUCCESS
                data: {}
                error:
                    nullable: true
                    example: null
        ErrorResponse:
            type: object
            required: [success, message, httpStatus, appCode, data, error]
            properties:
                success:
                    type: boolean
                    example: false
                message:
                    type: string
                httpStatus:
                    type: integer
                appCode:
                    type: string
                data:
                    nullable: true
                    example: null
                error:
                    type: object
                    properties:
                        message:
                            type: string
                        details: {}
        StateSyncResult:
            type: object
            required:
                - organizationName
                - scopeId
                - agColId
                - agreementVersion
                - statePoints
                - metricPoints
                - totalPoints
                - batches
            properties:
                organizationName:
                    type: string
                scopeId:
                    type: string
                agColId:
                    type: string
                agreementVersion:
                    type: string
                    description: Version number resolved by Registry, even when the selector was `auditableVersion`.
                statePoints:
                    type: integer
                    minimum: 0
                metricPoints:
                    type: integer
                    minimum: 0
                totalPoints:
                    type: integer
                    minimum: 0
                batches:
                    type: integer
                    minimum: 0
        DashboardResult:
            type: object
            properties:
                orgName:
                    type: string
                scopeId:
                    type: string
                agColId:
                    type: string
                agreementVersion:
                    type: integer
                agreementTemplateName:
                    type: string
                grafanaUid:
                    type: string
                grafanaUrl:
                    type: string
                    format: uri
                grafanaStatus:
                    type: string
                grafanaVersion:
                    type: integer
                panels:
                    type: integer

    responses:
        Unauthorized:
            description: Missing, invalid, or expired token
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        BadRequest:
            description: Invalid agreement version selector or request parameters
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        NotFound:
            description: Organization, scope, agreement collection or agreement version not found
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        BadGateway:
            description: An upstream service (Registry, Scope Manager, or Director) returned an invalid or unavailable response
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        InternalError:
            description: Unexpected Reporter, InfluxDB or Grafana error
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
